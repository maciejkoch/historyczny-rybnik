<button
  #trigger
  type="button"
  class="btn btn-ghost btn-square"
  aria-label="Menu serwisu"
  [attr.aria-expanded]="opened()"
  aria-controls="portal-menu-drawer portal-menu-dropdown"
  (click)="toggle()"
>
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <path d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>
<dialog
  #drawer
  id="portal-menu-drawer"
  class="drawer drawer-end portal-drawer"
  aria-label="Menu serwisu"
  (cancel)="$event.preventDefault(); close()"
  (keydown)="trapFocus($event)"
  (close)="close()"
  (click)="$event.target === drawer && close()"
  (window:resize)="close()"
>
  <div class="drawer-side portal-drawer-side">
    <section class="menu-panel">
      <header class="menu-heading">
        <span class="eyebrow">Menu serwisu</span>
        <button
          type="button"
          class="btn btn-ghost btn-square"
          aria-label="Zamknij menu"
          (click)="close()"
          autofocus
        >
          ×
        </button>
      </header>
      <ng-container *ngTemplateOutlet="links" />
    </section>
  </div>
</dialog>
<div
  #dropdown
  id="portal-menu-dropdown"
  popover="auto"
  class="dropdown dropdown-top dropdown-end portal-dropdown"
  (toggle)="onPopoverToggle($event)"
  (focusout)="onDropdownFocusOut($event)"
  (keydown.escape)="close()"
>
  <ng-container *ngTemplateOutlet="links" />
</div>
<ng-template #links>
  <nav class="menu-navigation" aria-label="Menu serwisu">
    <ul class="menu primary-links">
      <li>
        <a
          routerLink="/"
          routerLinkActive="menu-active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          (click)="close()"
          >Mapa</a
        >
      </li>
      <li>
        <a
          routerLink="/szukaj"
          queryParamsHandling="preserve"
          routerLinkActive="menu-active"
          ariaCurrentWhenActive="page"
          (click)="close()"
          >Szukaj</a
        >
      </li>
    </ul>
    <ul class="menu privacy-links">
      <li>
        <a
          routerLink="/prywatnosc"
          routerLinkActive="menu-active"
          ariaCurrentWhenActive="page"
          (click)="close()"
          >Polityka prywatności</a
        >
      </li>
      <li><button type="button" (click)="settings()">Ustawienia cookies</button></li>
    </ul>
  </nav>
</ng-template>
